<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuro & Language Matrix | 自適應雙軌學習系統</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-neuro: #38bdf8;
      --accent-german: #f59e0b;
      --accent-spanish: #10b981;
      --accent-thai: #ec4899;
      --locked-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .user-info { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; }
    .sync-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }

    .top-actions { display: flex; gap: 8px; align-items: center; }
    .action-btn {
      background: #334155;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #475569; }

    /* Mode Switcher */
    .device-switcher {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
    }
    .device-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .device-btn.active {
      background: var(--border);
      color: var(--text);
    }

    /* Learning Map Panel */
    .map-panel {
      background: #172554;
      border: 1px solid #1e40af;
      border-radius: 12px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .map-panel.show { display: flex; }
    .map-header { display: flex; justify-content: space-between; align-items: center; }
    .map-header h3 { font-size: 0.95rem; color: #93c5fd; }
    .book-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e3a8a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .book-title { font-size: 0.9rem; font-weight: bold; color: #fff; }
    .book-version { font-size: 0.75rem; color: #93c5fd; }
    .chapter-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chapter-badge {
      font-size: 0.75rem;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2px 8px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .import-box {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #1e3a8a;
      padding-top: 10px;
    }
    .import-box textarea {
      width: 100%;
      height: 80px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      font-size: 0.8rem;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      resize: vertical;
    }

    /* Dashboard */
    .dashboard {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .track-row { display: flex; flex-direction: column; gap: 6px; }
    .track-meta { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; }
    .progress-bar-bg {
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Tabs */
    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tab-btn.active { color: var(--text); border-color: var(--accent-neuro); }
    .tab-btn.locked { border-color: var(--locked-red); color: var(--locked-red); opacity: 0.7; }

    /* Card Core */
    .stage-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-neuro { background: rgba(56, 189, 248, 0.2); color: var(--accent-neuro); }
    .badge-german { background: rgba(245, 158, 11, 0.2); color: var(--accent-german); }
    .badge-spanish { background: rgba(16, 185, 129, 0.2); color: var(--accent-spanish); }
    .badge-thai { background: rgba(236, 72, 153, 0.2); color: var(--accent-thai); }

    .card-title { font-size: 1.15rem; margin-bottom: 6px; }
    .card-source-tag { font-size: 0.75rem; color: #38bdf8; margin-bottom: 8px; font-weight: 500; }
    .card-meta-info { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-prompt { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 16px; white-space: pre-line; line-height: 1.6; }

    /* Inputs */
    .input-area { margin-bottom: 16px; }
    textarea, input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { height: 120px; resize: vertical; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* Thai Immersion Panel */
    .thai-immersion-box {
      margin-top: 14px;
      background: #2e1065;
      border: 1px solid #7c3aed;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .token-bubble {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      padding: 6px 10px;
      border-radius: 8px;
      margin: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .token-bubble:hover { transform: scale(1.05); }
    .token-bubble.learned { border-color: #10b981; background: #064e3b; }

    /* Lock Overlay */
    .lock-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      gap: 12px;
      z-index: 10;
    }
  </style>

          ],

              id: "th_m1",

              unitReward: 0.1,
              answers: ["สวัสดี", "sawatdee", "sawasdee"]
            },
            {
              id: "th_m2",
              bookRef: "基礎泰語 · Unit 1",

              prompt: "【手機速記 · 字母快篩】\n泰文字母表的第一個字母「ก」（雞 / kai）屬於哪一類輔音（中輔音 / 高輔音 / 低輔音）？",

    let currentUser = null;
    let todayDate = getTaipeiDate();
    let currentSubject = "neuro";
    let currentDeviceMode = "desktop";
    
    let cardPointers = {
      neuro: { desktop: 0, mobile: 0 },
      german: { desktop: 0, mobile: 0 },
      spanish: { desktop: 0, mobile: 0 },
      thai: { desktop: 0, mobile: 0 }
    };

    let dailyData = {
      neuro: 0,
      german: 0,
      spanish: 0,
      thai: 0,
      completedCardIds: []
    };

    let thaiVocabSet = new Map();

    const authStatusEl = document.getElementById("auth-status");
    const neuroFillEl = document.getElementById("neuro-fill");
    const neuroTextEl = document.getElementById("neuro-text");
    const subFillEl = document.getElementById("sub-fill");
    const subTextEl = document.getElementById("sub-text");
    const lockOverlayEl = document.getElementById("lock-overlay");
    const mapPanelEl = document.getElementById("map-panel");
    const bookListEl = document.getElementById("book-list");
    const thaiImmersionBoxEl = document.getElementById("thai-immersion-box");

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authStatusEl.textContent = `已同步 (ID: ${user.uid.slice(0, 6)})`;
        listenToDailyLog(user.uid);
        listenToCustomCurriculum(user.uid);
        listenToThaiVocab(user.uid);
      } else {
        await signInAnonymously(auth);
      }
    });

    function listenToDailyLog(uid) {
      const docRef = doc(db, `users/${uid}/daily_logs/${todayDate}`);
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const remote = docSnap.data();
          dailyData.neuro = remote.neuro || 0;
          dailyData.german = remote.german || 0;
          dailyData.spanish = remote.spanish || 0;
          dailyData.thai = remote.thai || 0;
          dailyData.completedCardIds = Array.isArray(remote.completedCardIds) ? remote.completedCardIds : [];
        } else {
          setDoc(docRef, { neuro: 0, german: 0, spanish: 0, thai: 0, completedCardIds: [] });
        }
        renderDashboard();
        renderCard();
      });
    }

    function listenToCustomCurriculum(uid) {
      const docRef = doc(db, `users/${uid}/meta/curriculum`);
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const custom = docSnap.data();
          if (custom.books) CURRICULUM_DATA.books = custom.books;
          if (custom.questions) CURRICULUM_DATA.questions = custom.questions;
        }
        renderLearningMap();
        renderCard();
      });
    }

    function listenToThaiVocab(uid) {
      const docRef = doc(db, `users/${uid}/meta/thai_vocab`);
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const vData = docSnap.data().vocab || [];
          thaiVocabSet.clear();
          vData.forEach(v => thaiVocabSet.set(v.th, v));
        }
      });
    }

    function renderLearningMap() {
      bookListEl.innerHTML = "";
      CURRICULUM_DATA.books.forEach(b => {
        const card = document.createElement("div");
        card.className = "book-card";
        let tagsHtml = (b.chapters || []).map(ch => `<span class="chapter-badge">✓ ${ch}</span>`).join("");
        card.innerHTML = `
          <div class="book-title">📖 ${b.title}</div>
          <div class="book-version">版本：${b.version} (${b.subject.toUpperCase()})</div>
          <div class="chapter-tags">${tagsHtml}</div>
        `;
        bookListEl.appendChild(card);
      });
    }

    function renderDashboard() {
      const neuroUnits = dailyData.neuro || 0;
      const subUnits = (dailyData.german || 0) + (dailyData.spanish || 0);

      const neuroPct = Math.min((neuroUnits / 1.0) * 100, 100);
      neuroFillEl.style.width = `${neuroPct}%`;
      neuroFillEl.style.background = "var(--accent-neuro)";
      neuroTextEl.textContent = `${neuroUnits.toFixed(1)} / 1.0 單位 ${neuroUnits >= 1.0 ? '✓ 達標' : ''}`;

      const isNeuroComplete = neuroUnits >= 1.0;
      const subPct = isNeuroComplete ? 100 : Math.min((subUnits / 0.5) * 100, 100);
      subFillEl.style.width = `${subPct}%`;
      
      if (!isNeuroComplete && subUnits >= 0.5) {
        subFillEl.style.background = "var(--locked-red)";
        subTextEl.textContent = `${subUnits.toFixed(1)} / 0.5 (已達上限 · 鎖定中 🔒)`;
        document.getElementById("tab-german").classList.add("locked");
        document.getElementById("tab-spanish").classList.add("locked");
      } else {
        subFillEl.style.background = isNeuroComplete ? "#22c55e" : "var(--accent-german)";
        subTextEl.textContent = isNeuroComplete ? `${subUnits.toFixed(1)} (全科自由模式 ✨)` : `${subUnits.toFixed(1)} / 0.5 額度`;
        document.getElementById("tab-german").classList.remove("locked");
        document.getElementById("tab-spanish").classList.remove("locked");
      }
    }

    // 渲染卡片
    window.renderCard = function() {
      const neuroUnits = dailyData.neuro || 0;
      const subUnits = (dailyData.german || 0) + (dailyData.spanish || 0);
      const isSubLocked = (neuroUnits < 1.0) && (subUnits >= 0.5);
      
      if (isSubLocked && (currentSubject === "german" || currentSubject === "spanish")) {
        lockOverlayEl.style.display = "flex";
        return;
      }
      lockOverlayEl.style.display = "none";

      thaiImmersionBoxEl.style.display = currentSubject === "thai" ? "flex" : "none";

      const subjectPool = CURRICULUM_DATA.questions[currentSubject] || {};
      const list = subjectPool[currentDeviceMode] || [];

      if (!list || list.length === 0) {
        document.getElementById("card-badge").textContent = "無題目";
        document.getElementById("card-title").textContent = "此模式目前無可用題目";
        document.getElementById("card-source").textContent = "";
        document.getElementById("card-prompt").textContent = "請透過上方「學習地圖」匯入新章節題目。";
        document.getElementById("reward-unit").textContent = "+0.0";
        return;
      }

      const pointer = cardPointers[currentSubject][currentDeviceMode] % list.length;
      const item = list[pointer];
      const isCompletedToday = (dailyData.completedCardIds || []).includes(item.id);

      document.getElementById("card-badge").textContent = item.track || "學習進度";
      document.getElementById("card-badge").className = `badge badge-${currentSubject}`;
      document.getElementById("card-source").textContent = item.bookRef ? `📚 來源教材：${item.bookRef}` : "";
      document.getElementById("card-title").textContent = item.title;
      document.getElementById("card-meta").textContent = `題目 ${pointer + 1} / ${list.length} ${isCompletedToday ? '· (今日已驗收，不重複累加)' : ''}`;
      document.getElementById("card-prompt").textContent = item.prompt;
      
      const inputContainer = document.getElementById("input-container");
      if (currentDeviceMode === "desktop") {
        inputContainer.innerHTML = `<textarea id="user-ans" placeholder="【💻 電腦深研】請詳細輸入機制因果推導或論述（AI 教授審查，Ctrl+Enter 送出）..."></textarea>`;
      } else {
        inputContainer.innerHTML = `<input type="text" id="user-ans" placeholder="【📱 手機速記】請在此輸入答案（Enter 送出）..." autocomplete="off">`;
      }

const rewardUnitEl = document.getElementById("reward-unit");
if (rewardUnitEl) {
  rewardUnitEl.textContent = isCompletedToday ? "+0.0 (已累計)" : `+${item.unitReward}`;
}
      const userAnsEl = document.getElementById("user-ans");
      if (userAnsEl) {
        userAnsEl.addEventListener("keydown", (e) => {
          if (currentDeviceMode === "mobile") {
            if (e.key === "Enter") {
              e.preventDefault();
              submitProgress();
            }
          } else {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
              e.preventDefault();
              submitProgress();
            }
          }
        });
      }
    };

   // 核心：Gemini Flash API 審查函數（純 Flash 備援 + 阻斷 Pro 避免額度報錯）
    async function evaluateWithGemini(userAns, item) {
      const apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        const keyInput = prompt("🔑 首次使用 AI 審查，請貼入您的 Google AI Studio Gemini API Key：\n(金鑰僅儲存在您的瀏覽器本機，安全不外洩)");
        if (keyInput && keyInput.trim()) {
          localStorage.setItem("gemini_api_key", keyInput.trim());
          return evaluateWithGemini(userAns, item);
        } else {
          throw new Error("未提供 API Key，無法啟動 AI 教授審查。");
        }
      }

      const promptText = `你是一位歐洲頂尖大學神經科學與語言學的教授。請對學生的回答進行嚴格且專業的機制審查。

【題目】：
${item.prompt}

【標準參考機制/語法因果鏈】：
${item.reference || "請依據相關領域標準學術知識嚴格審查。"}

【學生回答】：
${userAns}

【審查規則】：
1. 嚴禁無意義字元（如 jjjjj、隨意字母拼湊、無邏輯廢話），若發現直接判定 passed: false。
2. 檢查學生是否真正解釋出「底層機制因果鏈」或「正確語法結構」，不能只是顛倒因果或拼湊術語。
3. 容許學生用自己的話或英文/中文解釋，只要物理/生物/語法機制本質等價即可給過。
4. 請「只輸出」標準 JSON 格式，不可有額外文字：
{
  "passed": true 或 false,
  "feedback": "50字內的精準講評，指出正確點或關鍵缺失"
}`;

      // 只保留高額度、免費層級專用的 Flash 家族，完全排除易被擋的 Pro 系列
      const flashModels = [
        "gemini-2.5-flash",
        "gemini-2.0-flash",
        "gemini-1.5-flash-latest"
      ];

      let lastErrMsg = "";
      let outputRaw = null;

      for (const modelName of flashModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: {
                temperature: 0.1,
                responseMimeType: "application/json"
              }
            })
          });

          if (res.ok) {
            const data = await res.json();
            outputRaw = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (outputRaw) break;
          } else {
            const errJson = await res.json().catch(() => ({}));
            lastErrMsg = errJson.error?.message || `HTTP ${res.status}`;
          }
        } catch (netErr) {
          lastErrMsg = netErr.message;
        }
      }

      if (!outputRaw) {
        throw new Error(`AI_UNAVAILABLE: ${lastErrMsg}`);
      }

      return JSON.parse(outputRaw);
    }
    // 提交驗收
    window.submitProgress = async function() {
      const inputEl = document.getElementById("user-ans");
      const submitBtn = document.getElementById("submit-btn");
      if (!inputEl) return;
      const userAns = inputEl.value.trim();

      if (!userAns) {
        alert("⚠️ 請先在輸入框填寫回答內容！");
        return;
      }

      const subjectPool = CURRICULUM_DATA.questions[currentSubject] || {};
      const list = subjectPool[currentDeviceMode] || [];
      if (!list || list.length === 0) return;
      
      const pointer = cardPointers[currentSubject][currentDeviceMode] % list.length;
      const item = list[pointer];

      let isPassed = false;

      // 手機端：本地速記比對
      if (currentDeviceMode === "mobile") {
        const cleanAns = userAns.toLowerCase();
        const validAnswers = (item.answers || []).map(a => a.toLowerCase());
        
        if (validAnswers.includes(cleanAns)) {
          isPassed = true;
          alert(`🎉 回答正確！獲得 +${item.unitReward} 單位進度。`);
        } else {
          alert(`❌ 答案有誤。\n您的回答：${userAns}\n參考正解：${item.answers ? item.answers[0] : "請重新確認"}`);
          return;
        }
      } else {
        // 電腦端：呼叫 Gemini 進行整句因果審查（含備援自主核驗）
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = "🤖 審查因果鏈中...";

          const evalResult = await evaluateWithGemini(userAns, item);

          if (evalResult.passed) {
            isPassed = true;
            alert(`✅ AI 教授審查通過！(+${item.unitReward} 單位)\n\n【講評】：${evalResult.feedback}`);
          } else {
            alert(`❌ 審查未通過！\n\n【AI 診斷漏洞】：${evalResult.feedback}\n\n請依據機制因果補充後重新提交！`);
            return;
          }
        } catch (err) {
          // 當遇 API 配額上限或網路繁忙時，啟用自主檢核機制
          const confirmSelf = confirm(
            `⚠️ AI 雲端連線繁忙或配額受限。\n\n是否切換為【自主因果核對模式】？\n\n【標準因果機制對照】：\n${item.reference || "請確認是否符合學術推導。"}\n\n若您確認剛才的回答已推導出關鍵機制，請點擊「確定」通過驗收；若推導不完整請按「取消」繼續修改。`
          );
          if (confirmSelf) {
            isPassed = true;
          } else {
            return;
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "驗收提交";
        }
      }

      if (isPassed) {
        const isCompletedToday = (dailyData.completedCardIds || []).includes(item.id);
        const unit = item.unitReward;

        if (!isCompletedToday) {
          dailyData[currentSubject] = (dailyData[currentSubject] || 0) + unit;
          dailyData.completedCardIds.push(item.id);

          if (currentUser) {
            try {
              const docRef = doc(db, `users/${currentUser.uid}/daily_logs/${todayDate}`);
              await updateDoc(docRef, {
                [currentSubject]: increment(unit),
                completedCardIds: dailyData.completedCardIds
              });
            } catch (e) {
              console.error("更新 Firestore 失敗：", e);
            }
          }
        } else {
          alert("💡 此題今日已計分過，本次驗收只作複習，不重複累加單位！");
        }

        inputEl.value = "";
        cardPointers[currentSubject][currentDeviceMode] = (cardPointers[currentSubject][currentDeviceMode] + 1) % list.length;
        renderCard();
      }
    };

// 智慧標準化課本名稱工具（避免大小寫或標點符號造成誤判）
    function normalizeBookName(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, "");
    }

    // 匯入自定義章節（具備智慧模糊去重合併）
    window.importCustomChapter = async function() {
      const rawText = document.getElementById("import-json-text").value.trim();
      if (!rawText) {
        alert("⚠️ 請先貼上 JSON 格式的章節題庫！");
        return;
      }

      try {
        const data = JSON.parse(rawText);
        if (!data.book || !data.questions) {
          throw new Error("JSON 格式缺少 'book' 或 'questions' 欄位。");
        }

        const sub = data.book.subject || "neuro";
        const incomingTitleNorm = normalizeBookName(data.book.title);

        // 1. 智慧尋找既有課本：只要科目相符且書名核心字串吻合即判定為同一本書
        let existingBook = CURRICULUM_DATA.books.find(b => 
          b.subject === sub && (
            normalizeBookName(b.title) === incomingTitleNorm ||
            normalizeBookName(b.title).includes(incomingTitleNorm) ||
            incomingTitleNorm.includes(normalizeBookName(b.title))
          )
        );

        if (existingBook) {
          // 課本已存在：僅追加新章節（避免重複標籤）
          if (!existingBook.chapters.includes(data.book.chapter)) {
            existingBook.chapters.push(data.book.chapter);
          }
        } else {
          // 全新課本：建立新項目
          CURRICULUM_DATA.books.push({
            id: `book_${Date.now()}`,
            title: data.book.title,
            version: data.book.version || "標準版",
            subject: sub,
            chapters: [data.book.chapter]
          });
        }

        // 2. 清理歷史已存在的重複項目（例如先前因字串差異被拆開的卡片）
        const consolidatedBooks = [];
        CURRICULUM_DATA.books.forEach(b => {
          const bNorm = normalizeBookName(b.title);
          const found = consolidatedBooks.find(item => item.subject === b.subject && normalizeBookName(item.title) === bNorm);
          if (found) {
            b.chapters.forEach(ch => {
              if (!found.chapters.includes(ch)) found.chapters.push(ch);
            });
          } else {
            consolidatedBooks.push({ ...b });
          }
        });
        CURRICULUM_DATA.books = consolidatedBooks;

        // 3. 題庫追加入庫
        const bookRefLabel = `${data.book.title} · ${data.book.chapter}`;
        if (!CURRICULUM_DATA.questions[sub]) {
          CURRICULUM_DATA.questions[sub] = { desktop: [], mobile: [] };
        }

        if (data.questions.desktop) {
          data.questions.desktop.forEach(q => {
            q.bookRef = bookRefLabel;
            // 避免題目 ID 重複造成累積錯誤
            if (!CURRICULUM_DATA.questions[sub].desktop.some(existQ => existQ.id === q.id)) {
              CURRICULUM_DATA.questions[sub].desktop.push(q);
            }
          });
        }
        if (data.questions.mobile) {
          data.questions.mobile.forEach(q => {
            q.bookRef = bookRefLabel;
            if (!CURRICULUM_DATA.questions[sub].mobile.some(existQ => existQ.id === q.id)) {
              CURRICULUM_DATA.questions[sub].mobile.push(q);
            }
          });
        }

        // 4. 同步至 Firestore
        if (currentUser) {
          const docRef = doc(db, `users/${currentUser.uid}/meta/curriculum`);
          await setDoc(docRef, CURRICULUM_DATA);
        }

        alert(`🎉 成功更新教材【${data.book.title}】！\n章節已自動歸併至該課本目錄下。`);
        document.getElementById("import-json-text").value = "";
        renderLearningMap();
        renderCard();
      } catch (err) {
        alert("❌ JSON 解析失敗，請確認格式是否正確：\n" + err.message);
      }
    };

    // 泰文句子解析
    window.parseThaiSentence = async function() {
      const rawText = document.getElementById("thai-sentence-json").value.trim();
      if (!rawText) return alert("請先貼上句子解析 JSON！");

      try {
        const parsed = JSON.parse(rawText);
        const displayEl = document.getElementById("thai-parsed-display");
        displayEl.innerHTML = "";

        const infoDiv = document.createElement("div");
        infoDiv.innerHTML = `
          <div style="font-size: 1.05rem; font-weight: bold; color: #fff;">${parsed.sentence.raw}</div>
          <div style="font-size: 0.85rem; color: #c084fc;">拼音：${parsed.sentence.roman}</div>
          <div style="font-size: 0.9rem; color: #cbd5e1; margin-top: 4px;">翻譯：${parsed.sentence.translation}</div>
          <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px; border-left: 2px solid #a855f7; padding-left: 6px;">語法：${parsed.grammarNotes || "無"}</div>
          <div style="margin-top: 10px; font-size: 0.8rem; color: #e9d5ff; font-weight: bold;">點擊單字可加入/更新個人單字庫：</div>
        `;
        displayEl.appendChild(infoDiv);

        const tokenContainer = document.createElement("div");
        tokenContainer.style.display = "flex";
        tokenContainer.style.flexWrap = "wrap";
        tokenContainer.style.marginTop = "8px";

        (parsed.tokens || []).forEach(tk => {
          const isLearned = thaiVocabSet.has(tk.th);
          const btn = document.createElement("div");
          btn.className = `token-bubble ${isLearned ? 'learned' : ''}`;
          btn.innerHTML = `
            <span style="font-size: 0.95rem; font-weight: bold; color: #fff;">${tk.th}</span>
            <span style="font-size: 0.7rem; color: #c084fc;">${tk.ro}</span>
            <span style="font-size: 0.75rem; color: #e2e8f0;">${tk.zh}</span>
            <span style="font-size: 0.65rem; color: #94a3b8;">${isLearned ? '✓ 已收錄' : '+ 新生詞'}</span>
          `;

          btn.onclick = async () => {
            if (currentUser) {
              const currentV = thaiVocabSet.get(tk.th) || { ...tk, seenCount: 0 };
              currentV.seenCount = (currentV.seenCount || 0) + 1;
              thaiVocabSet.set(tk.th, currentV);

              const docRef = doc(db, `users/${currentUser.uid}/meta/thai_vocab`);
              await setDoc(docRef, { vocab: Array.from(thaiVocabSet.values()) });

              btn.classList.add("learned");
              btn.querySelector("span:last-child").textContent = `✓ 已收錄 (${currentV.seenCount}次)`;
              alert(`已將「${tk.th}」同步至個人泰文詞庫！累計遇見：${currentV.seenCount} 次`);
            }
          };

          tokenContainer.appendChild(btn);
        });

        displayEl.appendChild(tokenContainer);
        document.getElementById("thai-sentence-json").value = "";
      } catch (e) {
        alert("解析失敗，請確認 JSON 格式：" + e.message);
      }
    };

    window.toggleLearningMap = () => mapPanelEl.classList.toggle("show");

    // 設定或重設 Gemini API Key
    window.configureApiKey = () => {
      const currentKey = localStorage.getItem("gemini_api_key") || "";
      const newKey = prompt("🔑 請輸入 Google AI Studio 的 Gemini API Key (留空可清除)：", currentKey);
      if (newKey !== null) {
        if (newKey.trim()) {
          localStorage.setItem("gemini_api_key", newKey.trim());
          alert("✅ Gemini API Key 已儲存於本機！電腦深研將啟動 AI 即時審查。");
        } else {
          localStorage.removeItem("gemini_api_key");
          alert("ℹ️ 已清除 API Key。");
        }
      }
    };

    window.switchSubject = (sub) => {
      currentSubject = sub;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`tab-${sub}`);
      if (btn) btn.classList.add("active");
      renderCard();
    };

    window.setDeviceMode = (mode) => {
      currentDeviceMode = mode;
      document.querySelectorAll(".device-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`mode-${mode}`);
      if (btn) btn.classList.add("active");
      renderCard();
    };

    renderLearningMap();
  </script>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="user-info">
      <span class="sync-status"></span><span id="auth-status">連線中...</span>
    </div>
    <div class="top-actions">
      <button class="action-btn" onclick="configureApiKey()">🔑 AI 設定</button>
      <button class="action-btn" onclick="toggleLearningMap()">🗺️ 學習地圖與匯入</button>
      <div class="device-switcher">
        <button id="mode-desktop" class="device-btn active" onclick="setDeviceMode('desktop')">💻 電腦深研</button>
        <button id="mode-mobile" class="device-btn" onclick="setDeviceMode('mobile')">📱 手機速記</button>
      </div>
    </div>
  </div>

  <!-- 學習地圖面板 -->
  <div id="map-panel" class="map-panel">
    <div class="map-header">
      <h3>📚 學習地圖：已匯入教材與章節</h3>
      <button class="action-btn" style="padding: 2px 8px;" onclick="toggleLearningMap()">✕ 關閉</button>
    </div>
    
    <div id="book-list" style="display: flex; flex-direction: column; gap: 8px;"></div>

    <div class="import-box">
      <span style="font-size: 0.8rem; color: #93c5fd; font-weight: bold;">📥 匯入新章節題庫 (貼上 JSON)：</span>
      <textarea id="import-json-text" placeholder='貼上符合格式的章節 JSON (包含 "book" 與 "questions")...'></textarea>
      <button class="btn" style="align-self: flex-end; padding: 6px 14px; font-size: 0.85rem;" onclick="importCustomChapter()">解析並同步至學習地圖 ➔</button>
    </div>
  </div>

  <!-- Dashboard 互鎖狀態 -->
  <div class="dashboard">
    <div class="track-row">
      <div class="track-meta">
        <span>主線：神經科學 (碩士筆試檢索)</span>
        <span id="neuro-text">0.0 / 1.0 單位</span>
      </div>
      <div class="progress-bar-bg">
        <div id="neuro-fill" class="progress-bar-fill"></div>
      </div>
    </div>
    <div class="track-row">
      <div class="track-meta">
        <span>副線：德文 / 西文 (制衡激勵)</span>
        <span id="sub-text">0.0 / 0.5 額度</span>
      </div>
      <div class="progress-bar-bg">
        <div id="sub-fill" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button id="tab-neuro" class="tab-btn active" onclick="switchSubject('neuro')">🧠 神經科學</button>
    <button id="tab-german" class="tab-btn" onclick="switchSubject('german')">🇩🇪 德文 (A1)</button>
    <button id="tab-spanish" class="tab-btn" onclick="switchSubject('spanish')">🇪🇸 西文 (A2)</button>
    <button id="tab-thai" class="tab-btn" onclick="switchSubject('thai')">🇹🇭 泰文 (興趣)</button>
  </div>

  <!-- Card Body -->
  <div class="stage-card">
    <div id="card-body">
      <div>
        <span id="card-badge" class="badge badge-neuro">讀取中</span>
        <div id="card-source" class="card-source-tag"></div>
        <h2 id="card-title" class="card-title">載入中...</h2>
        <div id="card-meta" class="card-meta-info"></div>
        <p id="card-prompt" class="card-prompt"></p>
      </div>
      
      <div>
        <div id="input-container" class="input-area"></div>
        
        <div class="action-row">
  <span style="font-size: 0.8rem; color: var(--text-muted);">Enter 或 Ctrl+Enter 快速送出</span>
  <button id="submit-btn" class="btn" onclick="submitProgress()">驗收提交 (<span id="reward-unit">+0.0</span>)</button>
</div>
      </div>
    </div>

    <!-- 互鎖鎖定畫面 -->
    <div id="lock-overlay" class="lock-overlay">
      <h3 style="color: var(--locked-red);">🔒 副線已達 0.5 額度上限</h3>
      <p style="font-size: 0.9rem; color: #cbd5e1; max-width: 420px;">
        為了避免逃避核心阻力，請先前往<strong>「神經科學」</strong>完成當日 1.0 單位驗收。達成後全天將解鎖語言無限暢讀模式！
      </p>
      <button class="btn" onclick="switchSubject('neuro')">立即前往神經科學 ➔</button>
    </div>
  </div>

  <!-- 泰文專屬：語境浸潤解析室與個人單字庫 -->
  <div id="thai-immersion-box" class="thai-immersion-box" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.9rem; font-weight: bold; color: #f472b6;">🇹🇭 泰文沉浸解析室 (影片字幕 / 感興趣句子)</span>
    </div>
    <textarea id="thai-sentence-json" style="width: 100%; height: 60px; background: #1e1b4b; border: 1px solid #6b21a8; color: #fff; font-size: 0.8rem; border-radius: 6px; padding: 6px; font-family: monospace;" placeholder="貼入由 Gemini 解析的泰文句子 JSON..."></textarea>
    <button class="btn" style="background: #a855f7; align-self: flex-end; padding: 6px 14px; font-size: 0.85rem;" onclick="parseThaiSentence()">解析句子與標記生詞 ➔</button>
    <div id="thai-parsed-display" style="margin-top: 6px;"></div>
  </div>
</div>

</body>
</html>
