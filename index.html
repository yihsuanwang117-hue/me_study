<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuro & Language Matrix | 自適應雙軌學習系統</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-neuro: #38bdf8;
      --accent-german: #f59e0b;
      --accent-spanish: #10b981;
      --locked-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Auth & Sync Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .user-info { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; }
    .sync-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }

    /* Dashboard: 進度與互鎖指示 */
    .dashboard {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .track-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .track-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .progress-bar-bg {
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Mode Selector (Device Context) */
    .device-switcher {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
    }
    .device-btn {
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .device-btn.active {
      background: var(--border);
      color: var(--text);
    }

    /* Subject Tabs */
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--text);
      border-color: var(--accent-neuro);
    }
    .tab-btn.locked {
      border-color: var(--locked-red);
      color: var(--locked-red);
      opacity: 0.7;
    }

    /* Learning Card Core */
    .stage-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-neuro { background: rgba(56, 189, 248, 0.2); color: var(--accent-neuro); }
    .badge-german { background: rgba(245, 158, 11, 0.2); color: var(--accent-german); }
    .badge-spanish { background: rgba(16, 185, 129, 0.2); color: var(--accent-spanish); }

    .card-title { font-size: 1.15rem; margin-bottom: 12px; }
    .card-prompt { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 16px; white-space: pre-line; }

    /* Answer Area */
    .input-area { margin-bottom: 16px; }
    textarea, input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { height: 110px; resize: vertical; }

    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* Lock Overlay */
    .lock-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      gap: 12px;
      z-index: 10;
    }
  </style>

  <!-- Firebase Scripts (Modular CDN v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Firebase 專案設定
    const firebaseConfig = {
      apiKey: "AIzaSyC3A8sd0lc18X8Hulo37q0rQA4iLV1GzOE",
      authDomain: "me-study-2fa07.firebaseapp.com",
      projectId: "me-study-2fa07",
      storageBucket: "me-study-2fa07.firebasestorage.app",
      messagingSenderId: "326324849702",
      appId: "1:326324849702:web:902b0da79bfb0433176ae7",
      measurementId: "G-HZQGG8SX3W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getTaipeiDate = () => {
      const now = new Date();
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(now);
    };

    // 完整題庫設計
    const CONTENT_STORE = {
      neuro: {
        desktop: [
          {
            id: "neu_d1",
            track: "神經科學 · 機制推導 (Level 1/2)",
            title: "動作電位離子動力學與單向傳導機制",
            prompt: "【電腦端驗收 · 英文論述】\n請說明電壓門控鈉通道（Nav）去活化（Inactivation）與活化（Activation）的差異，並說明絕對不應期與相對不應期如何保證動作電位單向傳導。",
            unitReward: 0.5,
            minChars: 15,
            reference: "去極化使鈉通道活化開啟，隨後 h-gate 快速關閉導致去活化與絕對不應期，阻擋逆向興奮，確保傳導單向。"
          }
        ],
        mobile: [
          {
            id: "neu_m1",
            track: "神經科學 · 隨身速記",
            title: "神經遞質受體分類辨別",
            prompt: "【手機速記 · 概念快檢】\nNMDA 受體在靜止膜電位下被哪一種二價陽離子阻斷？",
            unitReward: 0.1,
            answers: ["mg2+", "鎂", "鎂離子", "magnesium", "mg"]
          }
        ]
      },
      german: {
        desktop: [
          {
            id: "de_d1",
            track: "德文 · A1 結構造句",
            title: "從屬子句 (weil) 與動詞後置",
            prompt: "【電腦端驗收 · 骨架組裝】\n請將這兩句合併為一個帶有 'weil' 的句子，注意動詞詞序：\n1. Ich lerne heute fleißig Deutsch.\n2. Ich möchte 2027 in Deutschland studieren.",
            unitReward: 0.2,
            minChars: 10,
            reference: "Ich lerne heute fleißig Deutsch, weil ich 2027 in Deutschland studieren möchte."
          }
        ],
        mobile: [
          {
            id: "de_m1",
            track: "德文 · A1 格位快問",
            title: "Akkusativ 定冠詞變位",
            prompt: "【手機速記 · 填空】\nDer Mann kauft _____ (der) Tisch. (請填入正確冠詞形式)",
            unitReward: 0.1,
            answers: ["den"]
          }
        ]
      },
      spanish: {
        desktop: [
          {
            id: "es_d1",
            track: "西文 · A2 時態深度辨析",
            title: "Indefinido 與 Imperfecto 綜合寫作",
            prompt: "【電腦端驗收 · 段落推導】\n請造一個包含「持續背景（Imperfecto）」與「突發動作（Indefinido）」的複式句。",
            unitReward: 0.2,
            minChars: 10,
            reference: "Cuando yo dormía, sonó el teléfono."
          }
        ],
        mobile: [
          {
            id: "es_m1",
            track: "西文 · A2 動詞變位快篩",
            title: "不規則動詞 Indefinido",
            prompt: "【手機速記】\n動詞 'hacer' 在第三人稱單數 (él/ella) 的 Indefinido 變位是？",
            unitReward: 0.1,
            answers: ["hizo"]
          }
        ]
      }
    };

    // 應用狀態
    let currentUser = null;
    let todayDate = getTaipeiDate();
    let currentSubject = "neuro";
    let currentDeviceMode = "desktop";
    let dailyData = {
      neuro: 0,
      german: 0,
      spanish: 0
    };

    // UI 元件參照
    const authStatusEl = document.getElementById("auth-status");
    const neuroFillEl = document.getElementById("neuro-fill");
    const neuroTextEl = document.getElementById("neuro-text");
    const subFillEl = document.getElementById("sub-fill");
    const subTextEl = document.getElementById("sub-text");
    const lockOverlayEl = document.getElementById("lock-overlay");

    // 身份驗證初始化
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authStatusEl.textContent = `已即時同步 (ID: ${user.uid.slice(0, 6)})`;
        listenToDailyLog(user.uid);
      } else {
        await signInAnonymously(auth);
      }
    });

    // 監聽當日紀錄
    function listenToDailyLog(uid) {
      const docRef = doc(db, `users/${uid}/daily_logs/${todayDate}`);
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          dailyData = docSnap.data();
        } else {
          setDoc(docRef, { neuro: 0, german: 0, spanish: 0 });
        }
        renderDashboard();
        renderCard();
      });
    }

    // 儀表板計算
    function renderDashboard() {
      const neuroUnits = dailyData.neuro || 0;
      const subUnits = (dailyData.german || 0) + (dailyData.spanish || 0);

      // 主線計算
      const neuroPct = Math.min((neuroUnits / 1.0) * 100, 100);
      neuroFillEl.style.width = `${neuroPct}%`;
      neuroFillEl.style.background = "var(--accent-neuro)";
      neuroTextEl.textContent = `${neuroUnits.toFixed(1)} / 1.0 單位 ${neuroUnits >= 1.0 ? '✓ 達標' : ''}`;

      // 副線互鎖計算
      const isNeuroComplete = neuroUnits >= 1.0;
      const subPct = isNeuroComplete ? 100 : Math.min((subUnits / 0.5) * 100, 100);
      subFillEl.style.width = `${subPct}%`;
      
      if (!isNeuroComplete && subUnits >= 0.5) {
        subFillEl.style.background = "var(--locked-red)";
        subTextEl.textContent = `${subUnits.toFixed(1)} / 0.5 (已達上限 · 鎖定中 🔒)`;
        document.getElementById("tab-german").classList.add("locked");
        document.getElementById("tab-spanish").classList.add("locked");
      } else {
        subFillEl.style.background = isNeuroComplete ? "#22c55e" : "var(--accent-german)";
        subTextEl.textContent = isNeuroComplete ? `${subUnits.toFixed(1)} (全科自由模式 ✨)` : `${subUnits.toFixed(1)} / 0.5 額度`;
        document.getElementById("tab-german").classList.remove("locked");
        document.getElementById("tab-spanish").classList.remove("locked");
      }
    }

    // 渲染卡片核心
    window.renderCard = function() {
      const neuroUnits = dailyData.neuro || 0;
      const subUnits = (dailyData.german || 0) + (dailyData.spanish || 0);
      const isSubLocked = (neuroUnits < 1.0) && (subUnits >= 0.5);
      
      if (isSubLocked && (currentSubject === "german" || currentSubject === "spanish")) {
        lockOverlayEl.style.display = "flex";
        return;
      }
      lockOverlayEl.style.display = "none";

      const subjectPool = CONTENT_STORE[currentSubject] || {};
      const list = subjectPool[currentDeviceMode] || [];

      if (!list || list.length === 0) {
        document.getElementById("card-badge").textContent = "無題目";
        document.getElementById("card-title").textContent = "此模式目前無可用題目";
        document.getElementById("card-prompt").textContent = "請切換模式或學科。";
        document.getElementById("reward-unit").textContent = "+0.0";
        return;
      }

      const item = list[0];

      document.getElementById("card-badge").textContent = item.track || "學習進度";
      document.getElementById("card-badge").className = `badge badge-${currentSubject}`;
      document.getElementById("card-title").textContent = item.title || "";
      document.getElementById("card-prompt").textContent = item.prompt || "";
      
      const inputContainer = document.getElementById("input-container");
      if (currentDeviceMode === "desktop") {
        inputContainer.innerHTML = `<textarea id="user-ans" placeholder="【💻 電腦深研】請詳細輸入機制推導、因果鏈論述或完整句子（需滿 ${item.minChars || 15} 字）..."></textarea>`;
      } else {
        inputContainer.innerHTML = `<input type="text" id="user-ans" placeholder="【📱 手機速記】請在此輸入答案或簡答..." autocomplete="off">`;
      }

      document.getElementById("reward-unit").textContent = `+${item.unitReward}`;
    };

    // 提交驗收邏輯
    window.submitProgress = async function() {
      const inputEl = document.getElementById("user-ans");
      if (!inputEl) return;
      const userAns = inputEl.value.trim();

      // 空白防呆
      if (!userAns) {
        alert("⚠️ 請先在輸入框填寫回答內容！");
        return;
      }

      const subjectPool = CONTENT_STORE[currentSubject] || {};
      const list = subjectPool[currentDeviceMode] || [];
      if (!list || list.length === 0) return;
      const item = list[0];

      let isPassed = false;

      // 分流驗收
      if (currentDeviceMode === "mobile") {
        const cleanAns = userAns.toLowerCase();
        const validAnswers = (item.answers || []).map(a => a.toLowerCase());
        
        if (validAnswers.includes(cleanAns)) {
          isPassed = true;
          alert(`🎉 回答正確！獲得 +${item.unitReward} 單位進度。`);
        } else {
          alert(`❌ 答案有誤。\n您的回答：${userAns}\n參考正解：${item.answers ? item.answers[0] : "請重新確認"}`);
          return;
        }
      } else {
        const minLen = item.minChars || 15;
        if (userAns.length < minLen) {
          alert(`⚠️ 論述內容過短（目前已輸入 ${userAns.length} 字，電腦驗收需至少 ${minLen} 字）。\n請進一步補充因果機制！`);
          return;
        }

        isPassed = true;
        const feedback = item.reference 
          ? `\n\n【標準因果機制對照】：\n${item.reference}` 
          : "";
        alert(`✅ 電腦深研驗收通過！獲得 +${item.unitReward} 單位進度。${feedback}`);
      }

      // 累加並寫入 Firestore
      if (isPassed) {
        const unit = item.unitReward;

        if (currentUser) {
          try {
            const docRef = doc(db, `users/${currentUser.uid}/daily_logs/${todayDate}`);
            await updateDoc(docRef, {
              [currentSubject]: increment(unit)
            });
          } catch (e) {
            console.error("更新 Firestore 失敗：", e);
            alert("寫入雲端失敗，請確認 Firestore 權限。");
          }
        }

        inputEl.value = "";
      }
    };

    // 分頁切換
    window.switchSubject = (sub) => {
      currentSubject = sub;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`tab-${sub}`);
      if (btn) btn.classList.add("active");
      window.renderCard();
    };

    // 裝置模式切換（觸發重繪）
    window.setDeviceMode = (mode) => {
      currentDeviceMode = mode;
      document.querySelectorAll(".device-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`mode-${mode}`);
      if (btn) btn.classList.add("active");
      window.renderCard();
    };
  </script>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="user-info">
      <span class="sync-status"></span><span id="auth-status">連線中...</span>
    </div>
    <div class="device-switcher">
      <button id="mode-desktop" class="device-btn active" onclick="setDeviceMode('desktop')">💻 電腦深研</button>
      <button id="mode-mobile" class="device-btn" onclick="setDeviceMode('mobile')">📱 手機速記</button>
    </div>
  </div>

  <!-- Dashboard 互鎖狀態 -->
  <div class="dashboard">
    <div class="track-row">
      <div class="track-meta">
        <span>主線：神經科學 (碩士筆試檢索)</span>
        <span id="neuro-text">0.0 / 1.0 單位</span>
      </div>
      <div class="progress-bar-bg">
        <div id="neuro-fill" class="progress-bar-fill"></div>
      </div>
    </div>
    <div class="track-row">
      <div class="track-meta">
        <span>副線：德文 / 西文 (制衡激勵)</span>
        <span id="sub-text">0.0 / 0.5 額度</span>
      </div>
      <div class="progress-bar-bg">
        <div id="sub-fill" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button id="tab-neuro" class="tab-btn active" onclick="switchSubject('neuro')">🧠 神經科學</button>
    <button id="tab-german" class="tab-btn" onclick="switchSubject('german')">🇩🇪 德文 (A1)</button>
    <button id="tab-spanish" class="tab-btn" onclick="switchSubject('spanish')">🇪🇸 西文 (A2)</button>
  </div>

  <!-- Card Body -->
  <div class="stage-card">
    <div id="card-body">
      <span id="card-badge" class="badge badge-neuro">讀取中</span>
      <h2 id="card-title" class="card-title">載入中...</h2>
      <p id="card-prompt" class="card-prompt"></p>
      
      <div id="input-container" class="input-area"></div>
      
      <div class="action-row">
        <button class="btn" onclick="submitProgress()">驗收提交 (<span id="reward-unit">+0.0</span>)</button>
      </div>
    </div>

    <!-- 互鎖鎖定畫面 -->
    <div id="lock-overlay" class="lock-overlay" style="display: none;">
      <h3 style="color: var(--locked-red);">🔒 副線已達 0.5 額度上限</h3>
      <p style="font-size: 0.9rem; color: #cbd5e1; max-width: 400px;">
        為了避免逃避核心阻力，請先前往<strong>「神經科學」</strong>完成當日 1.0 單位驗收。達成後全天將解鎖語言無限暢讀模式！
      </p>
      <button class="btn" onclick="switchSubject('neuro')">立即前往神經科學 ➔</button>
    </div>
  </div>
</div>

</body>
</html>
